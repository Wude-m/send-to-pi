<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send to Pi</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --card: #f5f7fa;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --ok: #16a34a;
      --warn: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --border: #374151;
        --text: #f9fafb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --ok: #4ade80;
        --warn: #fbbf24;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px 16px;
      width: 320px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
    }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.warn { color: var(--warn); border-color: var(--warn); }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 10px 0 6px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 12px;
      transition: border-color 0.15s;
    }
    .item:hover { border-color: var(--accent); }
    .item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .item-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .item-name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-sub {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pill {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .empty {
      font-size: 12px;
      color: var(--muted);
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      text-align: center;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    button.link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }
    button.link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🚀 Send to Pi</div>
    <div id="bridgeBadge" class="badge">Checking...</div>
  </div>

  <div id="sectionLabel" class="section-label">Target Pi Session</div>
  <div id="sessionList" class="list"></div>

  <div class="footer">
    <button id="refreshBtn" class="link">Refresh</button>
    <button id="optionsBtn" class="link">Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
