<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send to Pi Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 20px;
      width: 320px;
      color: #333;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #16a34a;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>🚀 Send to Pi</h2>
  <div class="field">
    <label for="bridgePort">Bridge Daemon Port</label>
    <input type="number" id="bridgePort" min="1024" max="65535" value="18090" />
    <div class="hint">Default port is 18090, matching the send-to-pi bridge daemon.</div>
  </div>
  <button id="save">Save Settings</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
